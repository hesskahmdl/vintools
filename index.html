<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V-Tools Live Monitor</title>
  <style>
    :root {
      --bg-dark: #080a0d;
      --card-bg: #0f131a;
      --accent-green: #00ffa3;
      --accent-green-hover: #00cc82;
      --text-main: #ffffff;
      --text-muted: #64748b;
      --border-color: #1a202c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      background-color: #05070a;
      border-right: 1px solid var(--border-color);
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .brand { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; }
    .brand span { color: var(--accent-green); }

    .menu-group { display: flex; flex-direction: column; gap: 4px; }
    .menu-title { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; color: #475569; margin: 10px 0 5px 10px; }

    .menu-item {
      padding: 10px 12px;
      border-radius: 6px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
    }

    .menu-item.active, .menu-item:hover {
      background-color: #111827;
      color: var(--accent-green);
    }

    /* Main Container */
    .main-content { flex: 1; padding: 25px; overflow-y: auto; }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .status-pill {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-green);
    }

    /* Panel de Filtres / Multi-Recherche */
    .filter-box {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 25px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .filter-input {
      background-color: #05070a;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      flex: 1;
    }

    .filter-input:focus { border-color: var(--accent-green); }

    .btn-apply {
      padding: 10px 20px;
      background-color: var(--accent-green);
      border: none;
      border-radius: 6px;
      color: #000;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-apply:hover { background-color: var(--accent-green-hover); }

    /* Grid des cartes */
    .feed-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    /* Structure Carte */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }

    .fav-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      background: rgba(0,0,0,0.6);
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    .fav-btn.active { color: #ff4757; }

    .card-img-container {
      position: relative;
      width: 100%;
      height: 190px;
      border-radius: 6px;
      overflow: hidden;
      background-color: #1e293b;
    }

    .card-img { width: 100%; height: 100%; object-fit: cover; }

    .card-details { display: flex; flex-direction: column; gap: 4px; }
    
    .brand-size { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
    .card-title { font-size: 0.85rem; font-weight: 600; color: #f1f5f9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .seller-info { display: flex; align-items: center; gap: 6px; margin: 2px 0; font-size: 0.75rem; color: #94a3b8; }
    .seller-avatar { width: 14px; height: 14px; border-radius: 50%; background-color: var(--accent-green); }

    .condition-badge {
      display: inline-block;
      background-color: #1e293b;
      color: #94a3b8;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      width: fit-content;
    }

    .price-container { display: flex; align-items: baseline; gap: 6px; margin-top: 4px; }
    .price-main { font-size: 1.1rem; font-weight: 700; color: #fff; }

    .time-tag { font-size: 0.7rem; color: #64748b; }

    .btn-buy {
      width: 100%;
      padding: 9px;
      background-color: var(--accent-green);
      border: none;
      border-radius: 6px;
      color: #000;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: background-color 0.2s;
      display: block;
    }

    .btn-buy:hover { background-color: var(--accent-green-hover); }
    
    .stats-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="brand"><span>v</span>tools</div>
    
    <div class="menu-group">
      <div class="menu-title">Vinted</div>
      <button onclick="switchTab('feed')" id="tab-feed" class="menu-item active">Fil d'actualité</button>
      <button onclick="switchTab('favs')" id="tab-favs" class="menu-item">Favoris & Recommandations</button>
      <button onclick="switchTab('stats')" id="tab-stats" class="menu-item">Statistiques</button>
    </div>
  </div>

  <div class="main-content">
    <div class="header">
      <h2 id="page-title">Fil d'actualité</h2>
      <div class="status-pill">
        <div class="status-dot"></div>
        Scraper : Actif (<span id="items-count">0</span> affichés)
      </div>
    </div>

    <!-- Multi-Recherche -->
    <div class="filter-box" id="filter-box-container">
      <input type="text" id="search-keyword" class="filter-input" placeholder="Multi-recherche séparée par virgules (ex: nike running, adidas campus, stussy)" value="nike running">
      <button onclick="updateConfig()" class="btn-apply">Lancer la recherche</button>
    </div>

    <div class="feed-grid" id="feed">
      <div style="color: #64748b; grid-column: 1/-1;">Chargement des articles...</div>
    </div>
  </div>

  <script>
    const API_URL = 'https://synonymously-additional-jaxon.ngrok-free.dev';
    let currentTab = 'feed';
    let localFavs = [];

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab-${tab}`).classList.add('active');

      const filterBox = document.getElementById('filter-box-container');
      const pageTitle = document.getElementById('page-title');

      if (tab === 'feed') {
        pageTitle.innerText = "Fil d'actualité en direct";
        filterBox.style.display = 'flex';
        fetchItems();
      } else if (tab === 'favs') {
        pageTitle.innerText = "Mes Favoris & Recommandations";
        filterBox.style.display = 'none';
        fetchFavoritesAndRecs();
      } else if (tab === 'stats') {
        pageTitle.innerText = "Statistiques de Scraping";
        filterBox.style.display = 'none';
        fetchStats();
      }
    }

    async function fetchItems() {
      if (currentTab !== 'feed') return;
      try {
        const response = await fetch(`${API_URL}/api/feed`, {
          headers: { 'ngrok-skip-browser-warning': 'true' }
        });
        if (!response.ok) return;
        
        const data = await response.json();
        document.getElementById('items-count').innerText = data.count;
        renderItems(data.items);
      } catch (error) {
        console.error("Erreur flux:", error);
      }
    }

    async function fetchFavoritesAndRecs() {
      try {
        const [favRes, recRes] = await Promise.all([
          fetch(`${API_URL}/api/favorites`, { headers: { 'ngrok-skip-browser-warning': 'true' } }),
          fetch(`${API_URL}/api/recommendations`, { headers: { 'ngrok-skip-browser-warning': 'true' } })
        ]);

        const favData = await favRes.json();
        const recData = await recRes.json();
        
        localFavs = favData.favorites.map(f => f.id);
        const combined = [...favData.favorites, ...recData.items];
        
        document.getElementById('items-count').innerText = combined.length;
        renderItems(combined, true);
      } catch (e) {
        console.error("Erreur favoris:", e);
      }
    }

    async function fetchStats() {
      try {
        const response = await fetch(`${API_URL}/api/stats`, {
          headers: { 'ngrok-skip-browser-warning': 'true' }
        });
        const data = await response.json();
        
        const feedContainer = document.getElementById('feed');
        feedContainer.innerHTML = `
          <div class="stats-card" style="grid-column: 1/-1;">
            <h3>Dernière vérification : ${data.last_check || 'En cours'}</h3>
            <p><strong>Mots-clés surveillés :</strong> ${data.active_keywords.join(', ')}</p>
            <p><strong>Articles actuellement en mémoire :</strong> ${data.current_feed_items}</p>
            <p><strong>Total Favoris sauvegardés :</strong> ${data.total_favorites}</p>
          </div>
        `;
      } catch (e) {
        console.error("Erreur stats:", e);
      }
    }

    function renderItems(items, isFavView = false) {
      const feedContainer = document.getElementById('feed');
      if (!items || items.length === 0) {
        feedContainer.innerHTML = '<div style="color: #64748b; grid-column: 1/-1;">Aucun article trouvé pour le moment...</div>';
        return;
      }

      let htmlContent = '';
      items.forEach(item => {
        const isFav = localFavs.includes(item.id);
        htmlContent += `
          <div class="card">
            <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav(${JSON.stringify(item).replace(/"/g, '&quot;')})">♥</button>
            <div class="card-img-container">
              <img src="${item.image}" class="card-img" alt="${item.title}" onerror="this.src='https://via.placeholder.com/200x200/1e293b/8a99ad?text=Image+Indisponible'">
            </div>
            <div class="card-details">
              <div class="brand-size">${item.brand} • ${item.size}</div>
              <div class="card-title">${item.title}</div>
              
              <div class="seller-info">
                <div class="seller-avatar"></div>
                <span>${item.seller}</span>
              </div>

              <div class="condition-badge">${item.condition}</div>

              <div class="price-container">
                <span class="price-main">${item.price} €</span>
              </div>

              <div class="time-tag">${item.time_ago}</div>
            </div>
            <a href="${item.url}" target="_blank" class="btn-buy">Acheter</a>
          </div>
        `;
      });

      feedContainer.innerHTML = htmlContent;
    }

    async function toggleFav(item) {
      const isFav = localFavs.includes(item.id);
      const method = isFav ? 'DELETE' : 'POST';
      const url = isFav ? `${API_URL}/api/favorites?id=${item.id}` : `${API_URL}/api/favorites`;
      
      try {
        await fetch(url, {
          method: method,
          headers: { 
            'Content-Type': 'application/json',
            'ngrok-skip-browser-warning': 'true' 
          },
          body: isFav ? null : JSON.stringify(item)
        });

        if (isFav) {
          localFavs = localFavs.filter(id => id !== item.id);
        } else {
          localFavs.push(item.id);
        }

        if (currentTab === 'favs') {
          fetchFavoritesAndRecs();
        } else {
          fetchItems();
        }
      } catch (e) {
        console.error("Erreur modification favori:", e);
      }
    }

    async function updateConfig() {
      const keyword = document.getElementById('search-keyword').value;

      try {
        await fetch(`${API_URL}/api/config`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'ngrok-skip-browser-warning': 'true'
          },
          body: JSON.stringify({ keyword: keyword })
        });
      } catch (e) {
        console.error("Erreur mise à jour config :", e);
      }

      fetchItems();
    }

    // Exécution automatique toutes les 1.5s
    fetchItems();
    setInterval(() => {
      if (currentTab === 'feed') fetchItems();
    }, 1500);
  </script>
</body>
</html>
