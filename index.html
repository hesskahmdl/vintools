<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SK Tools</title>
  <style>
    :root {
      --bg-dark: #080a0d;
      --card-bg: #0f131a;
      --accent-green: #00ffa3;
      --accent-green-hover: #00cc82;
      --text-main: #ffffff;
      --text-muted: #64748b;
      --border-color: #1a202c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: row;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar Desktop */
    .sidebar {
      width: 240px;
      background-color: #05070a;
      border-right: 1px solid var(--border-color);
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex-shrink: 0;
    }

    .brand { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; }
    .brand span { color: var(--accent-green); }

    .menu-group { display: flex; flex-direction: column; gap: 4px; }
    .menu-title { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; color: #475569; margin: 10px 0 5px 10px; }

    .menu-item {
      padding: 10px 12px;
      border-radius: 6px;
      color: #94a3b8;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
    }

    .menu-item.active, .menu-item:hover {
      background-color: #111827;
      color: var(--accent-green);
    }

    /* Mobile Navigation */
    .mobile-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background-color: #05070a;
      border-top: 1px solid var(--border-color);
      z-index: 1000;
      justify-content: space-around;
      align-items: center;
    }

    .mobile-nav-btn {
      background: none;
      border: none;
      color: #64748b;
      font-size: 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .mobile-nav-btn.active { color: var(--accent-green); }

    /* Main Container */
    .main-content { 
      flex: 1; 
      padding: 20px; 
      overflow-y: auto; 
      padding-bottom: 80px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .status-pill {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-green);
    }

    /* Stats Bar (Prix Moyen, Min, Max) */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .stat-box {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-box .title { font-size: 0.7rem; color: #64748b; text-transform: uppercase; font-weight: 700; }
    .stat-box .val { font-size: 1.1rem; font-weight: 800; color: var(--accent-green); }

    /* Multi-Search Container */
    .multi-search-container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 25px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .slot-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .slot-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent-green);
      width: 80px;
    }

    .filter-input {
      background-color: #05070a;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      width: 100%;
    }

    .filter-input:focus { border-color: var(--accent-green); }

    .btn-apply {
      padding: 12px;
      background-color: var(--accent-green);
      border: none;
      border-radius: 6px;
      color: #000;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 5px;
    }

    .btn-apply:hover { background-color: var(--accent-green-hover); }

    /* Grid Responsive */
    .feed-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 12px;
    }

    @media (min-width: 768px) {
      .feed-grid {
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 16px;
      }
    }

    /* Structure Carte */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }

    .fav-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(0,0,0,0.6);
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    .fav-btn.active { color: #ff4757; }

    .card-img-container {
      position: relative;
      width: 100%;
      height: 160px;
      border-radius: 6px;
      overflow: hidden;
      background-color: #1e293b;
    }

    .card-img { width: 100%; height: 100%; object-fit: cover; }
    .card-details { display: flex; flex-direction: column; gap: 4px; }
    .brand-size { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
    .card-title { font-size: 0.8rem; font-weight: 600; color: #f1f5f9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .seller-info { display: flex; align-items: center; gap: 6px; margin: 2px 0; font-size: 0.75rem; color: #94a3b8; }
    .seller-avatar { width: 12px; height: 12px; border-radius: 50%; background-color: var(--accent-green); }

    .condition-badge {
      display: inline-block;
      background-color: #1e293b;
      color: #94a3b8;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      width: fit-content;
    }

    .price-container { display: flex; align-items: baseline; gap: 6px; margin-top: 2px; }
    .price-main { font-size: 1rem; font-weight: 700; color: #fff; }
    .time-tag { font-size: 0.7rem; color: var(--accent-green); font-weight: 600; }

    .btn-buy {
      width: 100%;
      padding: 8px;
      background-color: var(--accent-green);
      border: none;
      border-radius: 6px;
      color: #000;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: background-color 0.2s;
      display: block;
    }

    .btn-buy:hover { background-color: var(--accent-green-hover); }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      .sidebar { display: none; }
      .mobile-nav { display: flex; }
      .main-content { padding: 15px; }
      .header h2 { font-size: 1.2rem; }
    }
  </style>
</head>
<body>

  <!-- Sidebar Desktop -->
  <div class="sidebar">
    <div class="brand"><span>SK</span> tools</div>
    
    <div class="menu-group">
      <div class="menu-title">Vinted Monitor</div>
      <button onclick="switchTab('feed')" id="tab-feed" class="menu-item active">Fil (Max 40)</button>
      <button onclick="switchTab('search')" id="tab-search" class="menu-item">Multi-Recherche & Prix</button>
      <button onclick="switchTab('favs')" id="tab-favs" class="menu-item">Favoris</button>
      <button onclick="switchTab('stats')" id="tab-stats" class="menu-item">Statistiques</button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="header">
      <h2 id="page-title">Fil d'actualité en direct</h2>
      <div class="status-pill">
        <div class="status-dot"></div>
        Scraper : Actif (<span id="items-count">0</span>/40 affichés)
      </div>
    </div>

    <!-- Barre de Prix Moyen / Min / Max -->
    <div class="stats-bar" id="stats-bar">
      <div class="stat-box">
        <span class="title">Prix Moyen</span>
        <span class="val" id="stat-avg">0.00 €</span>
      </div>
      <div class="stat-box">
        <span class="title">Prix Min</span>
        <span class="val" id="stat-min" style="color: #64748b;">0.00 €</span>
      </div>
      <div class="stat-box">
        <span class="title">Prix Max</span>
        <span class="val" id="stat-max" style="color: #64748b;">0.00 €</span>
      </div>
    </div>

    <!-- Multi-Recherche + Prix Max -->
    <div class="multi-search-container" id="multi-search-panel" style="display: none;">
      <h3 style="font-size: 0.9rem; color: #94a3b8; margin-bottom: 5px;">Recherches & Filtres :</h3>
      
      <div class="slot-row"><span class="slot-label">Slot 1:</span><input type="text" id="slot-0" class="filter-input" placeholder="Ex: nike running"></div>
      <div class="slot-row"><span class="slot-label">Slot 2:</span><input type="text" id="slot-1" class="filter-input" placeholder="Ex: nike division"></div>
      <div class="slot-row"><span class="slot-label">Slot 3:</span><input type="text" id="slot-2" class="filter-input" placeholder="Ex: adidas campus"></div>
      <div class="slot-row"><span class="slot-label">Slot 4:</span><input type="text" id="slot-3" class="filter-input" placeholder="Ex: dunk low"></div>
      <div class="slot-row"><span class="slot-label">Slot 5:</span><input type="text" id="slot-4" class="filter-input" placeholder="Ex: carhartt jacket"></div>
      
      <div class="slot-row" style="margin-top: 10px; border-top: 1px solid var(--border-color); padding-top: 10px;">
        <span class="slot-label" style="color: #ff4757;">Prix Max (€):</span>
        <input type="number" id="max-price-input" class="filter-input" placeholder="Ex: 40 (Laissez vide pour désactiver)">
      </div>

      <button onclick="saveMultiConfig()" class="btn-apply">Appliquer les recherches & le filtre</button>
    </div>

    <div class="feed-grid" id="feed">
      <div style="color: #64748b; grid-column: 1/-1;">Chargement des annonces...</div>
    </div>
  </div>

  <!-- Bottom Nav Mobile -->
  <div class="mobile-nav">
    <button onclick="switchTab('feed')" id="mob-tab-feed" class="mobile-nav-btn active">
      <span>⚡</span>
      <span>Flux</span>
    </button>
    <button onclick="switchTab('search')" id="mob-tab-search" class="mobile-nav-btn">
      <span>🔍</span>
      <span>Recherches</span>
    </button>
    <button onclick="switchTab('favs')" id="mob-tab-favs" class="mobile-nav-btn">
      <span>♥</span>
      <span>Favoris</span>
    </button>
    <button onclick="switchTab('stats')" id="mob-tab-stats" class="mobile-nav-btn">
      <span>📊</span>
      <span>Stats</span>
    </button>
  </div>

  <script>
    const API_URL = 'https://synonymously-additional-jaxon.ngrok-free.dev';
    let currentTab = 'feed';
    let localFavs = [];

    async function loadCurrentConfig() {
      try {
        const res = await fetch(`${API_URL}/api/config`, { headers: { 'ngrok-skip-browser-warning': 'true' } });
        const data = await res.json();
        if (data.keywords && Array.isArray(data.keywords)) {
          data.keywords.forEach((kw, index) => {
            const el = document.getElementById(`slot-${index}`);
            if (el) el.value = kw;
          });
        }
        if (data.max_price !== undefined && data.max_price !== null) {
          document.getElementById('max-price-input').value = data.max_price;
        }
      } catch (e) { console.error(e); }
    }

    function switchTab(tab) {
      currentTab = tab;
      
      document.querySelectorAll('.menu-item, .mobile-nav-btn').forEach(el => el.classList.remove('active'));
      
      const deskTab = document.getElementById(`tab-${tab}`);
      if (deskTab) deskTab.classList.add('active');
      const mobTab = document.getElementById(`mob-tab-${tab}`);
      if (mobTab) mobTab.classList.add('active');

      const searchPanel = document.getElementById('multi-search-panel');
      const feedContainer = document.getElementById('feed');
      const pageTitle = document.getElementById('page-title');

      if (tab === 'feed') {
        pageTitle.innerText = "Fil d'actualité en direct (Max 40)";
        searchPanel.style.display = 'none';
        feedContainer.style.display = 'grid';
        fetchItems();
      } else if (tab === 'search') {
        pageTitle.innerText = "Multi-Recherche & Filtre Prix";
        searchPanel.style.display = 'flex';
        feedContainer.style.display = 'none';
        loadCurrentConfig();
      } else if (tab === 'favs') {
        pageTitle.innerText = "Mes Favoris";
        searchPanel.style.display = 'none';
        feedContainer.style.display = 'grid';
        fetchFavoritesAndRecs();
      } else if (tab === 'stats') {
        pageTitle.innerText = "Statistiques Globale";
        searchPanel.style.display = 'none';
        feedContainer.style.display = 'grid';
        fetchStats();
      }
    }

    async function fetchItems() {
      if (currentTab !== 'feed') return;
      try {
        const response = await fetch(`${API_URL}/api/feed`, {
          headers: { 'ngrok-skip-browser-warning': 'true' }
        });
        if (!response.ok) return;
        
        const data = await response.json();
        document.getElementById('items-count').innerText = data.displayed_count;
        
        if (data.stats) {
          document.getElementById('stat-avg').innerText = `${data.stats.avg_price} €`;
          document.getElementById('stat-min').innerText = `${data.stats.min_price} €`;
          document.getElementById('stat-max').innerText = `${data.stats.max_price} €`;
        }

        renderItems(data.items);
      } catch (error) {
        console.error("Erreur flux :", error);
      }
    }

    async function fetchFavoritesAndRecs() {
      try {
        const [favRes, recRes] = await Promise.all([
          fetch(`${API_URL}/api/favorites`, { headers: { 'ngrok-skip-browser-warning': 'true' } }),
          fetch(`${API_URL}/api/recommendations`, { headers: { 'ngrok-skip-browser-warning': 'true' } })
        ]);

        const favData = await favRes.json();
        const recData = await recRes.json();
        
        localFavs = favData.favorites.map(f => f.id);
        const combined = [...favData.favorites, ...recData.items].slice(0, 40);
        
        document.getElementById('items-count').innerText = combined.length;
        renderItems(combined);
      } catch (e) {
        console.error("Erreur favoris :", e);
      }
    }

    async function fetchStats() {
      try {
        const response = await fetch(`${API_URL}/api/stats`, {
          headers: { 'ngrok-skip-browser-warning': 'true' }
        });
        const data = await response.json();
        
        const feedContainer = document.getElementById('feed');
        feedContainer.innerHTML = `
          <div style="background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 20px; grid-column: 1/-1;">
            <h3 style="margin-bottom: 10px; color: var(--accent-green);">Statistiques du Scraper</h3>
            <p style="margin-bottom: 8px;"><strong>Dernière mise à jour :</strong> ${data.last_check || 'En cours'}</p>
            <p style="margin-bottom: 8px;"><strong>Recherches actives :</strong> ${data.active_keywords.join(', ') || 'Aucune'}</p>
            <p style="margin-bottom: 8px;"><strong>Filtre Prix Max :</strong> ${data.max_price_filter ? data.max_price_filter + ' €' : 'Aucun (Tous les prix)'}</p>
            <p style="margin-bottom: 8px;"><strong>Prix Moyen :</strong> ${data.avg_price} €</p>
            <p style="margin-bottom: 8px;"><strong>Prix le plus bas / haut :</strong> ${data.min_price} € / ${data.max_price} €</p>
            <p style="margin-bottom: 8px;"><strong>Articles affichés dans le flux :</strong> ${data.displayed_items} (Max 40)</p>
            <p><strong>Favoris enregistrés :</strong> ${data.total_favorites}</p>
          </div>
        `;
      } catch (e) { console.error(e); }
    }

    function renderItems(items) {
      const feedContainer = document.getElementById('feed');
      if (!items || items.length === 0) {
        feedContainer.innerHTML = '<div style="color: #64748b; grid-column: 1/-1;">Aucun article trouvé...</div>';
        return;
      }

      let htmlContent = '';
      items.forEach(item => {
        const isFav = localFavs.includes(item.id);
        htmlContent += `
          <div class="card">
            <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav(${JSON.stringify(item).replace(/"/g, '&quot;')})">♥</button>
            <div class="card-img-container">
              <img src="${item.image}" class="card-img" alt="${item.title}" onerror="this.src='https://via.placeholder.com/200x200/1e293b/8a99ad?text=Image+Indisponible'">
            </div>
            <div class="card-details">
              <div class="brand-size">${item.brand} • ${item.size}</div>
              <div class="card-title">${item.title}</div>
              
              <div class="seller-info">
                <div class="seller-avatar"></div>
                <span>${item.seller}</span>
              </div>

              <div class="condition-badge">${item.condition}</div>

              <div class="price-container">
                <span class="price-main">${item.price} €</span>
              </div>

              <div class="time-tag">${item.time_ago}</div>
            </div>
            <a href="${item.url}" target="_blank" class="btn-buy">Acheter</a>
          </div>
        `;
      });

      feedContainer.innerHTML = htmlContent;
    }

    async function toggleFav(item) {
      const isFav = localFavs.includes(item.id);
      const method = isFav ? 'DELETE' : 'POST';
      const url = isFav ? `${API_URL}/api/favorites?id=${item.id}` : `${API_URL}/api/favorites`;
      
      try {
        await fetch(url, {
          method: method,
          headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
          body: isFav ? null : JSON.stringify(item)
        });

        if (isFav) {
          localFavs = localFavs.filter(id => id !== item.id);
        } else {
          localFavs.push(item.id);
        }

        if (currentTab === 'favs') {
          fetchFavoritesAndRecs();
        } else {
          fetchItems();
        }
      } catch (e) { console.error(e); }
    }

    async function saveMultiConfig() {
      const keywords = [
        document.getElementById('slot-0').value,
        document.getElementById('slot-1').value,
        document.getElementById('slot-2').value,
        document.getElementById('slot-3').value,
        document.getElementById('slot-4').value,
      ];
      const maxPrice = document.getElementById('max-price-input').value;

      try {
        await fetch(`${API_URL}/api/config`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
          body: JSON.stringify({ 
            keywords: keywords,
            max_price: maxPrice !== "" ? parseFloat(maxPrice) : null
          })
        });
        switchTab('feed');
      } catch (e) {
        console.error("Erreur mise à jour config :", e);
      }
    }

    fetchItems();
    setInterval(() => {
      if (currentTab === 'feed') fetchItems();
    }, 1000); // Mise à jour instantanée toutes les 1 seconde
  </script>
</body>
</html>
